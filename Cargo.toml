[package]
name = "pluto-browser"
version = "0.1.0"
edition = "2021"
description = "Pluto Browser - Lightweight desktop web browser with a 100% native Rust UI"

[dependencies]
ab_glyph = "0.2"
anyhow = "1.0"
directories = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
softbuffer = "0.4"
tao = "0.37"
url = "2.5"
wry = { version = "0.57", features = ["devtools"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

