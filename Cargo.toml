[package]
name = "rust-browser-adit"
version = "0.1.0"
edition = "2021"
description = "Lightweight desktop web browser MVP built with Rust, wry, and tao"

[dependencies]
anyhow = "1.0"
directories = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tao = "0.37"
url = "2.5"
wry = { version = "0.57", features = ["devtools"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

