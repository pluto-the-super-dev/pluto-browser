<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab - Pluto Browser</title>
  <style>
    :root {
      --primary: #5645d4;
      --primary-pressed: #4534b3;
      --on-primary: #ffffff;
      --brand-navy: #0a1530;
      --link-blue: #0075de;
      --tint-peach: #ffe8d4;
      --tint-rose: #fde0ec;
      --tint-mint: #d9f3e1;
      --tint-lavender: #e6e0f5;
      --tint-sky: #dcecfa;
      --tint-yellow: #fef7d6;
      --tint-cream: #f8f5e8;
      --brand-orange-deep: #793400;
      --brand-purple-800: #391c57;
      --brand-green: #1aae39;
      --canvas: #ffffff;
      --surface: #f6f5f4;
      --surface-soft: #fafaf9;
      --hairline: #e5e3df;
      --hairline-soft: #ede9e4;
      --hairline-strong: #c8c4be;
      --ink-deep: #000000;
      --ink: #1a1a1a;
      --charcoal: #37352f;
      --slate: #5d5b54;
      --steel: #787671;
      --muted: #bbb8b1;
      --shadow-card: 0 4px 12px rgba(15, 15, 15, 0.06);
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --canvas: #191919;
        --surface: #202020;
        --surface-soft: #252525;
        --hairline: #2e2e2e;
        --hairline-soft: #292929;
        --hairline-strong: #434343;
        --ink: #f4f4f2;
        --charcoal: #e5e3df;
        --slate: #b5b2ab;
        --steel: #9b9993;
        --primary: #6b5be6;
        --primary-pressed: #5645d4;
        --tint-peach: #382515;
        --tint-mint: #163322;
        --tint-lavender: #2b2344;
        --tint-sky: #172b3d;
        --tint-yellow: #362e14;
        --tint-cream: #26231d;
        --brand-orange-deep: #ffb478;
        --brand-purple-800: #d6b6f6;
        --brand-green: #4cd468;
        --shadow-card: 0 6px 18px rgba(0, 0, 0, 0.35);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--canvas);
      color: var(--ink);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    .page-shell {
      max-width: 1040px;
      margin: 0 auto;
      padding: 28px 32px 64px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    /* Top utility strip */
    .workspace-topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--hairline);
    }

    .page-crumb {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
      color: var(--charcoal);
      cursor: default;
    }

    .page-crumb svg .pluto-mini-orbit {
      transform-origin: 16px 16px;
      will-change: transform;
      transition: transform 0.6s var(--ease-out);
    }

    .page-crumb:hover svg .pluto-mini-orbit {
      transform: rotate(14deg) scale(1.04);
    }

    .orbital-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      align-self: flex-start;
      padding: 4px 10px;
      border-radius: 9999px;
      background: var(--tint-lavender);
      color: var(--brand-purple-800);
      font-size: 12px;
      font-weight: 600;
    }

    .orbital-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--primary);
      animation: orbitPulse 2.8s ease-in-out infinite;
    }

    @keyframes orbitPulse {
      0%, 100% { opacity: 0.55; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .tool-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .btn-ghost {
      height: 32px;
      padding: 0 11px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--hairline);
      background: var(--canvas);
      color: var(--charcoal);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.14s var(--ease-out);
    }

    .btn-ghost:hover {
      background: var(--surface);
      border-color: var(--hairline-strong);
    }

    .btn-ghost:active {
      transform: translateY(-1px) scale(0.98);
    }

    .btn-primary {
      height: 36px;
      padding: 0 16px;
      border: none;
      border-radius: var(--radius-md);
      background: var(--primary);
      color: var(--on-primary);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.15s ease, transform 0.14s var(--ease-out);
    }

    .btn-primary:hover {
      background: var(--primary-pressed);
    }

    .btn-primary:active {
      transform: translateY(-1px) scale(0.98);
    }

    /* Workspace Hero Header */
    .workspace-header {
      display: flex;
      flex-direction: column;
      gap: 10px;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeUp 0.45s var(--ease-out) forwards;
    }

    .workspace-header h1 {
      font-size: clamp(28px, 3.6vw, 40px);
      font-weight: 600;
      letter-spacing: -0.5px;
      line-height: 1.15;
      color: var(--ink);
    }

    .workspace-header p {
      font-size: 15px;
      color: var(--slate);
    }

    /* Notion Search Input */
    .search-box {
      width: 100%;
      max-width: 680px;
      height: 46px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 6px 0 14px;
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-md);
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .search-box:focus-within {
      background: var(--canvas);
      border: 2px solid var(--primary);
      padding: 0 5px 0 13px;
    }

    .search-box svg {
      color: var(--steel);
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      height: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: var(--ink);
      font-family: inherit;
      font-size: 15px;
    }

    .search-input::placeholder {
      color: var(--steel);
    }

    /* Database Section Header & Filter Pill Tabs */
    .db-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .db-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--ink);
    }

    .pill-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .pill-tab {
      padding: 5px 12px;
      border-radius: 9999px;
      border: 1px solid var(--hairline);
      background: transparent;
      color: var(--steel);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.14s ease, color 0.14s ease, border-color 0.14s ease;
    }

    .pill-tab:hover {
      color: var(--ink);
    }

    .pill-tab.active {
      background: var(--ink-deep);
      color: #ffffff;
      border-color: var(--ink-deep);
    }

    /* Cards Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .tile {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 18px;
      background: var(--canvas);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-lg);
      text-decoration: none;
      color: var(--ink);
      cursor: pointer;
      transition: transform 0.18s var(--ease-out), border-color 0.16s ease, box-shadow 0.18s ease;
    }

    .tile:hover {
      transform: translateY(-2px);
      border-color: var(--hairline-strong);
      box-shadow: var(--shadow-card);
    }

    .tile-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .tile-icon {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      background: var(--surface);
      border: 1px solid var(--hairline);
      color: var(--charcoal);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      overflow: hidden;
    }

    .tile-icon img {
      width: 16px;
      height: 16px;
      object-fit: contain;
    }

    .prop-tag {
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      line-height: 1.4;
    }

    .tag-lavender { background: var(--tint-lavender); color: var(--brand-purple-800); }
    .tag-peach { background: var(--tint-peach); color: var(--brand-orange-deep); }
    .tag-mint { background: var(--tint-mint); color: var(--brand-green); }
    .tag-sky { background: var(--tint-sky); color: var(--link-blue); }

    .tile-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tile-url {
      font-size: 13px;
      color: var(--steel);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tile-remove {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 2px 7px;
      border: 1px solid var(--hairline);
      border-radius: var(--radius-sm);
      background: var(--canvas);
      color: var(--steel);
      display: none;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
    }

    .tile:hover .tile-remove {
      display: inline-flex;
      align-items: center;
    }

    .tile-remove:hover {
      background: var(--surface);
      color: var(--ink);
    }

    /* Two-column bottom workspace: Bookmarks + Scratchpad */
    .split-workspace {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 20px;
      align-items: start;
    }

    .scratchpad-card {
      background: var(--tint-cream);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .scratchpad-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
      color: var(--charcoal);
    }

    .scratchpad-status {
      font-size: 12px;
      font-weight: 500;
      color: var(--steel);
    }

    .scratchpad-area {
      width: 100%;
      min-height: 140px;
      border: 1px solid var(--hairline);
      border-radius: var(--radius-md);
      background: var(--canvas);
      color: var(--ink);
      padding: 12px;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.5;
      resize: vertical;
      outline: none;
    }

    .scratchpad-area:focus {
      border: 2px solid var(--primary);
      padding: 11px;
    }

    .empty-bookmarks {
      padding: 24px;
      border-radius: var(--radius-lg);
      background: var(--surface);
      border: 1px solid var(--hairline);
      color: var(--slate);
      font-size: 14px;
    }

    .hidden {
      display: none !important;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 860px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      .split-workspace { grid-template-columns: 1fr; }
    }

    @media (max-width: 560px) {
      .grid { grid-template-columns: 1fr; }
      .page-shell { padding: 20px 16px 48px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <div class="workspace-topbar">
      <div class="page-crumb">
        <svg width="24" height="24" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <defs>
            <radialGradient id="nt-pluto-sphere" cx="35%" cy="30%" r="75%">
              <stop offset="0%" stop-color="#f8e8d8" />
              <stop offset="48%" stop-color="#9e74cc" />
              <stop offset="100%" stop-color="#2c2459" />
            </radialGradient>
          </defs>
          <rect x="1.5" y="1.5" width="29" height="29" rx="7.5" fill="#0a1530" />
          <g class="pluto-mini-orbit">
            <path d="M5.5 21.5C3.8 18.6 8.3 13.4 15.6 10.6C22.9 7.8 28.4 8.7 26.5 11.8" stroke="#9d8df7" stroke-width="1.35" stroke-linecap="round" opacity="0.65" />
            <circle cx="16" cy="16" r="6.6" fill="url(#nt-pluto-sphere)" />
            <path d="M16.2 13.9C17.3 13.1 18.7 13.6 18.7 14.9C18.7 16.3 16.5 17.7 16.2 18C15.9 17.7 13.7 16.3 13.7 14.9C13.7 13.6 15.1 13.1 16.2 13.9Z" fill="#fff5ec" opacity="0.38" />
            <path d="M26.5 11.8C27.9 14.7 23.3 19.6 16.1 22.3C8.9 25 3.8 24.2 5.5 21.5" stroke="#e5d6ff" stroke-width="1.55" stroke-linecap="round" />
            <circle cx="25.2" cy="8.5" r="1.9" fill="#d6b6f6" />
          </g>
        </svg>
        <span>Pluto Browser / Workspace</span>
      </div>
      <div class="tool-strip">
        <button id="btn-xray" class="btn-ghost" type="button">Live X-Ray</button>
        <button id="btn-devtools" class="btn-ghost" type="button">F12 DevTools</button>
        <button id="btn-open-welcome" class="btn-ghost" type="button">Welcome &amp; Benchmarks</button>
      </div>
    </div>

    <header class="workspace-header">
      <div class="orbital-status">
        <span class="orbital-dot" aria-hidden="true"></span>
        <span>Kuiper Orbit Active</span>
      </div>
      <h1 id="greeting-title">Pluto Workspace</h1>
      <p id="clock-subtitle">Search the web with DuckDuckGo, open a pinned bookmark, or inspect any page.</p>
    </header>

    <form id="search-form" class="search-box" autocomplete="off">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <circle cx="7" cy="7" r="4.5" />
        <path d="M10.5 10.5L13.5 13.5" />
      </svg>
      <input
        id="search-input"
        class="search-input"
        type="text"
        placeholder="Search DuckDuckGo or type a URL..."
        autofocus
      />
      <button class="btn-primary" type="submit">Go</button>
    </form>

    <section>
      <div class="db-head">
        <h2 class="db-title">Quick Links</h2>
        <div class="pill-tabs" id="cat-tabs">
          <button class="pill-tab active" type="button" data-cat="all">All</button>
          <button class="pill-tab" type="button" data-cat="dev">Engineering</button>
          <button class="pill-tab" type="button" data-cat="ref">Reference</button>
        </div>
      </div>
      <div class="grid" id="quick-links"></div>
    </section>

    <section class="split-workspace">
      <div>
        <div class="db-head">
          <h2 class="db-title">Saved Bookmarks</h2>
        </div>
        <div id="bookmarks-empty" class="empty-bookmarks">
          No bookmarks saved yet. Click the star button in the address bar on any site to pin it here.
        </div>
        <div class="grid hidden" id="bookmarks-grid" style="grid-template-columns: repeat(2, 1fr);"></div>
      </div>

      <aside class="scratchpad-card">
        <div class="scratchpad-head">
          <span>Workspace Notes</span>
          <span class="scratchpad-status" id="note-status">Saved locally</span>
        </div>
        <textarea
          id="scratchpad"
          class="scratchpad-area"
          placeholder="Jot down URLs, debug notes, or tasks..."
        ></textarea>
      </aside>
    </section>
  </div>

  <script>
    (function () {
      const greetingTitle = document.getElementById("greeting-title");
      const clockSubtitle = document.getElementById("clock-subtitle");
      function updateTime() {
        const now = new Date();
        const h = now.getHours();
        const part = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
        const hh = String(h).padStart(2, "0");
        const mm = String(now.getMinutes()).padStart(2, "0");
        greetingTitle.textContent = part + ", Pluto Explorer";
        clockSubtitle.textContent = hh + ":" + mm + " local time - orbiting cleanly on Rust + WebView2.";
      }
      updateTime();
      setInterval(updateTime, 30000);

      const quickLinks = [
        { title: "DuckDuckGo", url: "https://duckduckgo.com", badge: "D", cat: "ref", tag: "Search", cls: "tag-sky" },
        { title: "GitHub", url: "https://github.com", badge: "G", cat: "dev", tag: "Code", cls: "tag-lavender" },
        { title: "Rust Lang", url: "https://www.rust-lang.org", badge: "R", cat: "dev", tag: "Rust", cls: "tag-peach" },
        { title: "MDN Web Docs", url: "https://developer.mozilla.org", badge: "M", cat: "dev", tag: "Docs", cls: "tag-mint" },
        { title: "Wikipedia", url: "https://en.wikipedia.org", badge: "W", cat: "ref", tag: "Wiki", cls: "tag-sky" },
        { title: "Hacker News", url: "https://news.ycombinator.com", badge: "Y", cat: "ref", tag: "Feed", cls: "tag-peach" }
      ];

      const quickGrid = document.getElementById("quick-links");
      const catTabs = document.querySelectorAll("#cat-tabs .pill-tab");
      const bookmarksEmpty = document.getElementById("bookmarks-empty");
      const bookmarksGrid = document.getElementById("bookmarks-grid");
      const searchForm = document.getElementById("search-form");
      const searchInput = document.getElementById("search-input");
      const scratchpad = document.getElementById("scratchpad");
      const noteStatus = document.getElementById("note-status");

      function post(payload) {
        if (window.ipc && typeof window.ipc.postMessage === "function") {
          window.ipc.postMessage(JSON.stringify(payload));
        }
      }

      function hostLabel(rawUrl) {
        try {
          return new URL(rawUrl).hostname.replace(/^www\./, "");
        } catch (_) {
          return rawUrl;
        }
      }

      function renderQuickLinks(filterCat) {
        quickGrid.innerHTML = "";
        const filtered = quickLinks.filter(function (item) {
          return filterCat === "all" || item.cat === filterCat;
        });
        for (const item of filtered) {
          const card = document.createElement("a");
          card.className = "tile";
          card.href = item.url;

          const top = document.createElement("div");
          top.className = "tile-top";

          const icon = document.createElement("div");
          icon.className = "tile-icon";
          icon.textContent = item.badge;

          const tag = document.createElement("span");
          tag.className = "prop-tag " + item.cls;
          tag.textContent = item.tag;

          top.appendChild(icon);
          top.appendChild(tag);

          const title = document.createElement("div");
          title.className = "tile-title";
          title.textContent = item.title;

          const sub = document.createElement("div");
          sub.className = "tile-url";
          sub.textContent = hostLabel(item.url);

          card.appendChild(top);
          card.appendChild(title);
          card.appendChild(sub);
          quickGrid.appendChild(card);
        }
      }

      catTabs.forEach(function (tab) {
        tab.addEventListener("click", function () {
          catTabs.forEach(function (t) { t.classList.remove("active"); });
          tab.classList.add("active");
          renderQuickLinks(tab.dataset.cat);
        });
      });
      renderQuickLinks("all");

      window.__setBookmarks = function (bookmarks) {
        if (!Array.isArray(bookmarks) || bookmarks.length === 0) {
          bookmarksEmpty.classList.remove("hidden");
          bookmarksGrid.classList.add("hidden");
          bookmarksGrid.innerHTML = "";
          return;
        }
        bookmarksEmpty.classList.add("hidden");
        bookmarksGrid.classList.remove("hidden");
        bookmarksGrid.innerHTML = "";

        for (const bm of bookmarks) {
          const card = document.createElement("a");
          card.className = "tile";
          card.href = bm.url;

          const top = document.createElement("div");
          top.className = "tile-top";

          const icon = document.createElement("div");
          icon.className = "tile-icon";
          if (bm.favicon) {
            const img = document.createElement("img");
            img.src = bm.favicon;
            img.alt = "";
            img.onerror = function () {
              icon.textContent = (bm.title || "B").slice(0, 1).toUpperCase();
            };
            icon.appendChild(img);
          } else {
            icon.textContent = (bm.title || "B").slice(0, 1).toUpperCase();
          }

          top.appendChild(icon);

          const title = document.createElement("div");
          title.className = "tile-title";
          title.textContent = bm.title || hostLabel(bm.url);

          const sub = document.createElement("div");
          sub.className = "tile-url";
          sub.textContent = hostLabel(bm.url);

          const removeBtn = document.createElement("button");
          removeBtn.type = "button";
          removeBtn.className = "tile-remove";
          removeBtn.textContent = "Remove";
          removeBtn.addEventListener("click", function (e) {
            e.preventDefault();
            e.stopPropagation();
            post({ cmd: "remove_bookmark", url: bm.url });
          });

          card.appendChild(top);
          card.appendChild(title);
          card.appendChild(sub);
          card.appendChild(removeBtn);
          bookmarksGrid.appendChild(card);
        }
      };

      try {
        const savedNote =
          window.localStorage.getItem("pluto_workspace_note") ||
          window.localStorage.getItem("adit_workspace_note");
        if (savedNote) scratchpad.value = savedNote;
      } catch (_) {}

      scratchpad.addEventListener("input", function () {
        try {
          window.localStorage.setItem("pluto_workspace_note", scratchpad.value);
          noteStatus.textContent = "Saved";
        } catch (_) {}
      });

      document.getElementById("btn-open-welcome").addEventListener("click", function () {
        post({ cmd: "open_onboarding" });
      });
      document.getElementById("btn-xray").addEventListener("click", function () {
        if (window.__plutoToggleInspector) {
          window.__plutoToggleInspector();
        } else if (window.__aditToggleInspector) {
          window.__aditToggleInspector();
        } else {
          post({ cmd: "toggle_inspector" });
        }
      });
      document.getElementById("btn-devtools").addEventListener("click", function () {
        post({ cmd: "open_devtools" });
      });

      searchForm.addEventListener("submit", function (e) {
        e.preventDefault();
        const query = searchInput.value.trim();
        if (!query) return;
        post({ cmd: "navigate", input: query });
      });

      post({ cmd: "ui_ready" });
    })();
  </script>
</body>
</html>
